// ----- aksi -----
function drFind(key) { return S.project.drawings.find(r => rowKey(r) === key); }
function drLocate(groups, row) {
  for (const g of groups) for (const sb of g.subs) { const i = sb.rows.indexOf(row); if (i > -1) return { g: g, sb: sb, i: i }; }
  return null;
}
/** Pindahkan baris (urutan dipertahankan) ke sub-grup tujuan, sebelum baris `beforeRow` (atau di akhir). */
function drMove(rows, gName, subName, beforeRow) {
  drBegin();
  const groups = drGroups();
  const g2 = groups.find(x => x.name === gName);
  if (!g2) return;
  let sb2 = g2.subs.find(x => x.name === subName);
  if (!sb2) { sb2 = { name: subName, rows: [] }; g2.subs.push(sb2); }
  const touched = new Map(); // sub -> {g, start}
  const note = (g, sb) => { if (!touched.has(sb)) touched.set(sb, { g: g, start: subStart(g, sb) }); };
  note(g2, sb2);
  rows.forEach(r => { const loc = drLocate(groups, r); if (loc) note(loc.g, loc.sb); });
  rows.forEach(r => { const loc = drLocate(groups, r); if (loc) loc.sb.rows.splice(loc.sb.rows.indexOf(r), 1); });
  let at = beforeRow ? sb2.rows.indexOf(beforeRow) : -1;
  if (at < 0) at = sb2.rows.length;
  sb2.rows.splice.apply(sb2.rows, [at, 0].concat(rows));
  const renames = {};
  touched.forEach((v, sb) => renumberSub(v.g, sb, v.start, renames));
  const names = new Set([g2.name]);
  touched.forEach(v => names.add(v.g.name));
  drCommit(groups, Array.from(names).map(n => ({ key: n, title: n })), renames);
}
function drSelected() { return S.project.drawings.filter(r => DR.sel.has(rowKey(r))); }
function drSpecsFor(rows, extra) {
  const names = new Set(extra || []);
  rows.forEach(r => names.add(r.Series));
  return Array.from(names).filter(Boolean).map(n => ({ key: n, title: n }));
}
function drBulkSet(field, value) {
  const rows = drSelected();
  if (!rows.length || !value) return;
  drBegin();
  const groups = drGroups();
  rows.forEach(r => { r[field] = value; });
  drCommit(groups, drSpecsFor(rows));
}
function drDelete() {
  const rows = drSelected();
  if (!rows.length) return;
  if (!confirm('Delete ' + rows.length + ' drawing(s)? The rows in DRAWING LIST will be deleted too.')) return;
  drBegin();
  const groups = drGroups();
  rows.forEach(r => { const loc = drLocate(groups, r); if (loc) loc.sb.rows.splice(loc.i, 1); });
  drCommit(groups, drSpecsFor(rows));
}
function drDuplicate(target) {
  const rows = drSelected();
  if (!rows.length || !target) return;
  const [gName, subName] = target.split('\u0001');
  drBegin();
  const groups = drGroups();
  const g = groups.find(x => x.name === gName);
  let sb = g.subs.find(x => x.name === subName);
  if (!sb) { sb = { name: subName, rows: [] }; g.subs.push(sb); }
  const copies = [];
  rows.forEach(r => {
    const c = Object.assign(drRec(r), { _lnew: 1, _tmp: 1, _row: null, _cid: ++cidSeq });
    c.Code = nextCode(g, sb.name, copies);
    copies.push(c);
  });
  sb.rows.push.apply(sb.rows, copies);
  drCommit(groups, [{ key: g.name, title: g.name }]);
}
function drStep(dir) {
  const rows = drSelected();
  if (!rows.length) return;
  const groups = drGroups();
  const first = drLocate(groups, rows[0]);
  if (!first) return;
  const sbRows = first.sb.rows;
  if (rows.some(r => sbRows.indexOf(r) === -1)) { toast('Moving up/down only works for drawings in the same sub-group.'); return; }
  const idx = rows.map(r => sbRows.indexOf(r)).sort((a, b) => a - b);
  if (dir < 0 && idx[0] === 0) return;
  if (dir > 0 && idx[idx.length - 1] === sbRows.length - 1) return;
  const before = dir < 0 ? sbRows[idx[0] - 1] : sbRows[idx[idx.length - 1] + 2] || null;
  drMove(idx.map(i => sbRows[i]), first.g.name, first.sb.name, before);
}
/** Tambah satu gambar dari baris "+" (cepat: langsung ke antrean addRow). */
function drQuickAdd(addRowEl) {
  const series = addRowEl.dataset.series, sub = addRowEl.dataset.sub;
  const codeEl = addRowEl.querySelector('.add-code'), titleEl = addRowEl.querySelector('.add-title');
  const title = titleEl.value.trim();
  if (!title) return false;
  const g = drGroups().find(x => x.name === series);
  const code = codeEl.value.trim() || nextCode(g, sub);
  localAdd('drawings', { Series: series, Sub: sub, Code: code, Title: title, PIC: S.user.code, Progress: list('Status')[0] || '' });
  S.project.drawings.forEach((r, i) => { r.No = String(i + 1); });
  return true;
}
/** Paste beberapa baris sekaligus (dari Excel/Sheets/PDF): satu baris = satu gambar. */
function drPasteMany(addRowEl, text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+$/, '')).filter(l => l.trim());
  if (lines.length < 2 && text.indexOf('\t') === -1) return false;
  const series = addRowEl.dataset.series, sub = addRowEl.dataset.sub;
  drBegin();
  const groups = drGroups();
  const g = groups.find(x => x.name === series);
  const sb = g.subs.find(x => x.name === sub);
  const added = [];
  lines.forEach(l => {
    const cells = l.split('\t').map(x => x.trim());
    let code = '', title = '', pic = '', scale = '';
    if (cells.length > 1 && /\d/.test(cells[0]) && /^[A-Z0-9_\-.]+$/i.test(cells[0])) { code = cells[0]; title = cells[1] || ''; pic = cells[2] || ''; scale = cells[3] || ''; }
    else title = cells.filter(Boolean).join(' ');
    if (!title && !code) return;
    const r = { Code: code || nextCode(g, sub, added), Title: title, PIC: pic || S.user.code, Scale: scale, Progress: list('Status')[0] || '', Notes: '', _lnew: 1, _tmp: 1, _row: null, _cid: ++cidSeq };
    added.push(r);
  });
  if (!added.length) return false;
  sb.rows.push.apply(sb.rows, added);
  drCommit(groups, [{ key: g.name, title: g.name }]);
  toast(added.length + ' drawing(s) added.');
  return true;
}
function drNewSeries() {
  const name = (prompt('New series name (e.g. AR_900SERIES_DETAIL)') || '').trim();
  if (!name) return;
  if (drGroups().some(g => g.name.toLowerCase() === name.toLowerCase())) { toast('That series already exists.', { error: true }); return; }
  drBegin();

  setTimeout(() => { const el = document.querySelector('.draw-add[data-series="' + CSS.escape(name) + '"] .add-title'); if (el) el.focus(); }, 30);
}

function drAddSub(name) {

function drRenameSub(name, sub) {

function drCycleRev(key, n) {

  if (el.matches('#tab-body .draw-row input.cell')) {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); drFocusNext(el, e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { const r = drFind(el.dataset.key); if (r) el.value = r[el.dataset.f] || ''; el.blur(); }
    else if (e.key === 'ArrowDown' && (e.altKey || e.ctrlKey)) { e.preventDefault(); drFocusNext(el, 1); }
    else if (e.key === 'ArrowUp' && (e.altKey || e.ctrlKey)) { e.preventDefault(); drFocusNext(el, -1); }
  }
});

// geser urutan (drag & drop di desktop)
document.addEventListener('dragstart', e => {
  const h = e.target.closest && e.target.closest('[data-drag]');
  if (!h) return;
  const key = h.dataset.drag;
  const keys = DR.sel.has(key) ? drSelected().map(rowKey) : [key];
  DR.drag = keys;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', keys.join(',')); } catch (err) {}
  const row = h.closest('.draw-row');
  if (row) { e.dataTransfer.setDragImage(row, 20, 16); row.classList.add('dragging'); }
});
function drClearDrop() { document.querySelectorAll('.drop-before, .drop-after, .drop-into').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-into')); }
document.addEventListener('dragover', e => {
  if (!DR.drag) return;
  const t = e.target.closest && e.target.closest('#tab-body .draw-row, #tab-body .draw-add, #tab-body .dr-sub, #tab-body .dr-series-head');
  if (!t) return;
  e.preventDefault();
  drClearDrop();
  if (t.classList.contains('draw-row')) {
    const r = t.getBoundingClientRect();
    t.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
  } else t.classList.add('drop-into');
});
document.addEventListener('dragend', () => { DR.drag = null; drClearDrop(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
document.addEventListener('drop', e => {
  if (!DR.drag) return;
  const t = e.target.closest && e.target.closest('#tab-body .draw-row, #tab-body .draw-add, #tab-body .dr-sub, #tab-body .dr-series-head');
  const keys = DR.drag; DR.drag = null;
  drClearDrop();
  if (!t) return;
  e.preventDefault();
  const rows = keys.map(drFind).filter(Boolean);
  if (t.classList.contains('draw-row')) {
    const target = drFind(t.dataset.key);
    if (!target || rows.indexOf(target) > -1) return;
    const r = t.getBoundingClientRect();
    const after = e.clientY >= r.top + r.height / 2;
    const groups = drGroups();
    const loc = drLocate(groups, target);
    const siblings = loc.sb.rows.filter(x => rows.indexOf(x) === -1);
    const before = after ? siblings[siblings.indexOf(target) + 1] || null : target;
    drMove(rows, target.Series, target.Sub || '', before);
  } else {
    drMove(rows, t.dataset.series, t.dataset.sub || '', null);
  }
});

function bindInfoForm() {

function saveInfo(changed, pid) {
  pid = pid || S.projectId;
  const d = S.cache[pid];
  if (d && d.info) Object.assign(d.info, changed);
  const pr = S.projects.find(x => x.id === pid);
  if (pr) { // nama/tahap/PIC di sidebar & ringkasan ikut berubah langsung
    if ('Project Name' in changed) pr.name = changed['Project Name'];
    if ('Stage' in changed) pr.stage = changed.Stage;
    if ('PIC' in changed) pr.pic = changed.PIC;
    if ('Project Code' in changed) pr.code = changed['Project Code'];
    if ('Cover Photo' in changed) pr.cover = changed['Cover Photo'];
    if ('Cover Crop' in changed) pr.coverCrop = changed['Cover Crop'];
    if ('Color' in changed) pr.color = changed.Color;
    if ('Current Status' in changed) pr.status = changed['Current Status'];
    if ('Priority' in changed) pr.priority = changed.Priority;
    if ('Notes' in changed) pr.notes = changed.Notes;
    if ('Category' in changed) pr.category = changed.Category;
    renderSidebar();
  }
  const ov = S.overview && S.overview.projects.find(x => x.id === pid);
  if (ov && ov.info) Object.assign(ov.info, changed);
  if (ov && 'Cover Photo' in changed) ov.cover = changed['Cover Photo'];
  if (ov && 'Color' in changed) ov.color = changed.Color;
  if (ov) [['Current Status', 'status'], ['Priority', 'priority'], ['Notes', 'notes'], ['Category', 'category']].forEach(x => { if (x[0] in changed) ov[x[1]] = changed[x[0]]; });
  enqueue({ pid: pid, type: 'info', fields: changed });
}

function schemaFields(kind) { const f = SCHEMA[kind].fields; return typeof f === 'function' ? f() : f; }
function fieldHtml(f, value) {
  const v = value == null ? '' : value;
  const id = 'f-' + f.k.replace(/\W+/g, '-');
  const label = esc(f.label) + (f.req ? ' *' : '');

    return '<fieldset class="field wide color-field drive-mode"><legend>' + label + '</legend>' +
      [['new', 'Create a new folder automatically', 'PROJECT NAME folder in 002 WORKING, with a copy of 000 FOLDER TEMP'],
       ['link', 'Use an existing folder', 'Paste the project folder link from Drive']].map(o =>
        '<label class="radio-card"><input type="radio" name="' + esc(f.k) + '" value="' + o[0] + '" data-change="drive-mode"' + (cur === o[0] ? ' checked' : '') + '>' +
        '<span><b>' + o[1] + '</b><span>' + o[2] + '</span></span></label>').join('') + '</fieldset>';
  }
  if (f.t === 'color') {
    return '<fieldset class="field' + (f.wide ? ' wide' : '') + ' color-field"><legend>' + label + '</legend><div class="swatches">' +
      [['', 'No color']].concat(swatchList()).map(c => (a => '<label class="swatch' + (c[0] ? a.cls : ' none') + '"' + a.style + ' title="' + esc(c[1]) + '">' +
        '<input type="radio" name="' + esc(f.k) + '" value="' + esc(c[0]) + '"' + (String(v) === c[0] ? ' checked' : '') + '><span class="sr">' + esc(c[1]) + '</span></label>')(colorAttr(c[0], true))).join('') +
      (cv => '<label class="swatch custom" title="Custom color"' + (cv ? ' style="background:' + v + '"' : '') + '><span class="plus" aria-hidden="true">+</span>' +
        '<input type="radio" name="' + esc(f.k) + '" value="' + (cv ? esc(v) : '') + '"' + (cv ? ' checked' : '') + ' tabindex="-1">' +
        '<input type="color" class="color-input" data-change="custom-color-field" value="' + (HEX_RE.test(v) ? v : '#9DB4A0') + '" aria-label="Custom color"></label>')(HEX_RE.test(v) && !swatchList().some(c => c[0] === v)) +
      '</div></fieldset>';
  }
  if (f.t === 'area') {
    control = '<textarea class="area" id="' + id + '" name="' + esc(f.k) + '">' + esc(v) + '</textarea>';
  } else if (f.t === 'pic' || f.t === 'list') {
    const opts = f.t === 'pic' ? S.team.map(m => [m.code, m.code + ' · ' + m.name]) : (f.opts || list(f.list)).map(o => [o, o]);
    if (v && !opts.some(o => o[0] === String(v))) opts.unshift([String(v), String(v)]);
    control = '<select class="select" id="' + id + '" name="' + esc(f.k) + '"><option value="">–</option>' +
      opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(v) === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  } else {
    const type = f.t === 'date' ? (isYmd(v) || v === '' ? 'date' : 'text') : f.t === 'url' ? 'url' : 'text';
    control = '<input class="input" id="' + id + '" name="' + esc(f.k) + '" type="' + type + '" value="' + esc(v) + '"' +
      (f.hint ? ' placeholder="' + esc(f.hint) + '"' : '') + (f.req ? ' required' : '') + (f.datalist ? ' list="dl-' + f.datalist + '"' : '') + '>';
  }
  return '<label class="field' + (f.wide ? ' wide' : '') + '" for="' + id + '"><span>' + label + '</span>' + control + '</label>';
}
function readForm(form, fields) {
  const out = {};
  fields.forEach(f => {
    const el = form.elements[f.k];
    if (!el) return;
    out[f.k] = (el instanceof RadioNodeList || (el.length && !el.tagName)) ? (Array.from(el).find(x => x.checked) || { value: '' }).value : el.value.trim();
  });
  return out;
}
function datalists() {
  const p = S.project || { drawings: [], meta: {} };
  const meta = p.meta || {};
  const uniq = a => Array.from(new Set(a.filter(Boolean)));
  const series = uniq((meta.series || []).map(s => s.name).concat(p.drawings.map(r => r.Series)));
  const subs = uniq([].concat.apply([], (meta.series || []).map(s => s.subs)).concat(['BASEMENT', 'LANTAI 1', 'LANTAI 2']));
  const codes = uniq(p.drawings.map(r => r.Code));
  const cats = uniq((meta.fileCategories || []).concat(list('File Category')));
  const dl = (id, arr) => '<datalist id="dl-' + id + '">' + arr.map(s => '<option value="' + esc(s) + '">').join('') + '</datalist>';
  return dl('series', series) + dl('subs', subs) + dl('drawings', codes) + dl('filecats', cats);
}

    '<div class="wide crop-row"><div class="crop-frame small" id="crop-mobile"><img alt="" id="crop-img-b"' + (coverEd.src ? ' src="' + esc(coverEd.src) + '"' : '') + '><span>Phone</span></div>' +

function coverSrcTab(v) {

  $('#cover-src-link').hidden = v !== 'link'; $('#cover-src-link').style.display = v === 'link' ? 'flex' : 'none';

function coverUseLink() {
  const v = $('#cover-link').value.trim();
  const u = coverUrl(v, 2000);
  if (!u) { toast('Paste a valid image link.', { error: true }); return; }
  coverEd.link = v; coverEd.file = null; coverEd.src = u; coverEd.x = 50; coverEd.y = 50; coverEd.z = 1; $('#crop-zoom').value = 1;
  coverPaint(true);
}
function coverPaint(newSrc) {
  ['#crop-img-a', '#crop-img-b'].forEach(sel => {
    const img = $(sel);
    if (!img) return;
    if (newSrc) img.src = coverEd.src;
    img.style.cssText = coverEd.src ? cropStyle(coverEd) : 'display:none';
    img.onerror = () => { const h = $('#cover-hint'); if (h) h.textContent = 'Can\'t open the image. Make sure the file is shared with "anyone with the link".'; };
  });
  const h = $('#cover-hint');
  if (h && coverEd.src) h.textContent = 'Drag the photo to choose the visible area, adjust zoom below.';
}
function shrinkImage(file, maxSide) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => reject(new Error('Can\'t read the image.'));
    img.src = URL.createObjectURL(file);
  });
}
async function saveCover(e) {
  e.preventDefault();
  if (!coverEd || !coverEd.src) { toast('Choose a photo first.', { error: true }); return; }
  const crop = [coverEd.x, coverEd.y, coverEd.z].map(v => Math.round(v * 100) / 100).join(',');
  const pid = S.projectId;
  if (!coverEd.file) {
    saveInfo({ 'Cover Photo': coverEd.link, 'Cover Crop': crop }, pid);
    closeDrawer(); render(true);
    return;
  }
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const data = await shrinkImage(coverEd.file, 2400);
    const res = await call('uploadCover', { id: pid, data: data, type: 'image/jpeg' });
    saveInfo({ 'Cover Photo': res.url, 'Cover Crop': crop }, pid);
    closeDrawer(); render(true);
    toast('Cover photo saved in the project folder.');
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Save';
    handleError(err);
  }
}

    saveBootCache(); renderSidebar();
    if (!fields.code) rerenderView();
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Save profile';
    const box = $('#pf-error'); if (box) box.textContent = err.message; else handleError(err);
  }
}
function chooseBuddy(n) {
  if (!n || n === S.user.buddy) { closeDrawer(); return; }
  const prev = S.user.buddy;
  S.user.buddy = n;
  const me = S.team.find(t => t.code === S.user.code);
  const prevTeam = me ? me.buddy : 0;
  if (me) me.buddy = n;
  closeDrawer(); renderSidebar(); rerenderView();
  call('setBuddy', { buddy: n }).then(() => { saveBootCache(); toast('Your buddy has been changed.'); }).catch(err => {
    S.user.buddy = prev; if (me) me.buddy = prevTeam;
    renderSidebar(); rerenderView(); handleError(err);
  });
}
function rerenderView() {
  if (S.view === 'project') render(true);
  else if (S.view === 'home') paintHome();
  else if (S.view === 'me') paintMe();
}

async function submitDrawer(e) {
  e.preventDefault();
  const form = e.target;
  const st = drawerState;
  const schema = SCHEMA[st.kind];
  const fields = schemaFields(st.kind);
  const data = readForm(form, fields);
  const missing = fields.filter(f => f.req && !data[f.k]).map(f => f.label);
  if (missing.length) { toast(missing.join(', ') + ' is required.', { error: true }); return; }
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = st.kind === 'newproject' ? 'Preparing the sheet…' : 'Saving…';
  try {
    if (st.kind === 'newproject') {
      if (data['Drive Mode'] === 'link' && !/drive\.google\.com\/.*(folders\/|id=)/.test(data['Drive Folder'] || '')) {
        btn.disabled = false; btn.textContent = 'Create project';
        toast('Paste a Google Drive folder link (one with /folders/…).', { error: true }); return;
      }
      if (data['Drive Mode'] !== 'link') delete data['Drive Folder'];
      const res = await call('createProject', { fields: data });
      closeDrawer();
      invalidateOverview(); await refreshBootstrap();
      toast('Project ' + res.project.name + ' is ready.' + (res.shareErrors && res.shareErrors.length ? ' Couldn\'t share with: ' + res.shareErrors.join(', ') : ''));
      openProject(res.project.id, 'info');
      return;
    }
    if (!st.row) localAdd(st.kind, data);
    else {
      const row = liveRow(st.kind, st.row);
      const changed = {};
      Object.keys(data).forEach(k => { if (String(data[k]) !== String(row[k] == null ? '' : row[k])) changed[k] = data[k]; });
      if (Object.keys(changed).length) localUpdate(st.kind, row, changed);
    }
    closeDrawer();
    render(true);
  } catch (err) {
    btn.disabled = false; btn.textContent = st.kind === 'newproject' ? 'Create project' : 'Save';
    handleError(err, () => { closeDrawer(); reloadProject(); });
  }
}
async function deleteFromDrawer() {
  const st = drawerState;
  if (!st || !st.row) return;
  if (!confirm('Delete ' + SCHEMA[st.kind].title + '? The row in Google Sheets will be deleted too.')) return;
  localDelete(st.kind, liveRow(st.kind, st.row));
  closeDrawer();
  render(true);
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function replaceRow(tab, oldRow, newRow) {
  const arr = S.project[tab];
  const i = arr.findIndex(r => rowKey(r) === rowKey(oldRow));
  if (i > -1) arr[i] = newRow; else arr.push(newRow);
}
function invalidateOverview() { S.overviewAt = 0; }

function quickUpdate(tab, key, record) {
  const row = findRow(tab, key);
  if (!row) return;
  localUpdate(tab, row, record);
  render(true);
}

// ---------- Events ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (el.tagName === 'A') return;
  // kontrol di dalam baris project (status, prioritas) jangan ikut membuka project
  if (a === 'open-project' && el !== e.target && e.target.closest('select, textarea, input, .meta-pop')) return;
  switch (a) {
    case 'toggle-nav': $('#shell').classList.toggle('nav-open'); break;
    case 'go': go(el.dataset.view); break;
    case 'open-project': e.stopPropagation(); openProject(el.dataset.id, el.dataset.tab); break;
    case 'toggle-archived': S.ui.showArchived = !S.ui.showArchived; renderSidebar(); break;
    case 'logout':
      if (Q.jobs.length && !confirm('Some changes are still being saved. Sign out now?')) return;
      call('logout').catch(() => {}); clearLocalData(); forceLogout(''); break;
    case 'refresh-home': case 'refresh-me': case 'refresh-all': refreshAll(); break;
    case 'reload-project': reloadProject(); break;
    case 'new-project': closeNav(); openNewChooser(); break;
    case 'connect-project': closeNav(); openConnectStep1(''); break;
    case 'connect-back': openConnectStep1(drawerState && drawerState.url); break;
    case 'tab': S.tab = el.dataset.tab; renderProject(); break;
    case 'task-filter': S.ui.taskFilter = el.dataset.v; renderTab(); break;
    case 'task-view': S.ui.taskView = el.dataset.v; renderTab(); break;
    case 'rev-filter': S.ui.revFilter = el.dataset.v; renderTab(); break;
    case 'add': {
      const defaults = { tasks: { PIC: S.user.code, Status: list('Status')[0] || '', Start: todayStr() },
        daily: { Date: todayStr(), PIC: S.user.code }, drawings: { PIC: S.user.code, Progress: list('Status')[0] || '' },
        revisions: { Date: todayStr(), Status: list('Status')[0] || '' }, meetings: { Date: todayStr() }, files: {} }[el.dataset.tab];
      openDrawer(el.dataset.tab, null, defaults); break;
    }
    case 'edit': {
      if (e.target.closest('select, .check, a')) return;
      const row = findRow(el.dataset.tab, el.dataset.key);
      if (row) openDrawer(el.dataset.tab, row);
      break;
    }
    case 'close-drawer': closeDrawer(); break;
    case 'pick-buddy': closeNav(); openProfile(); break;
    case 'proj-filter': store.set('projFilter', el.dataset.v); renderSidebar(); break;
    case 'new-choice': if (el.dataset.v === 'import') openConnectStep1(''); else openDrawer('newproject', null, { Stage: stages()[0], PIC: S.user.code, 'Current Status': 'Going' }); break;
    case 'auth': authPanel(el.dataset.mode, '', { ident: el.dataset.ident || ($('#lg-email') ? $('#lg-email').value.trim() : '') || ($('#fg-ident') ? $('#fg-ident').value.trim() : '') }); break;
    case 'profile-buddy': {
      document.querySelectorAll('.buddy-opt').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      if (drawerState) drawerState.buddy = Number(el.dataset.n);
      break;
    }
    case 'dr-sel': { const k = el.dataset.key; if (DR.sel.has(k)) DR.sel.delete(k); else DR.sel.add(k); renderTab(); break; }
    case 'dr-sel-group': {
      const g = drGroups().find(x => x.name === el.dataset.series);
      const rows = [].concat.apply([], g.subs.map(x => x.rows)).map(rowKey);
      const on = !rows.every(k => DR.sel.has(k));
      rows.forEach(k => { if (on) DR.sel.add(k); else DR.sel.delete(k); });
      renderTab(); break;
    }
    case 'dr-clear': DR.sel.clear(); renderTab(); break;
    case 'dr-collapse': {
      const n = el.dataset.series;
      if (DR.collapsed.has(n)) DR.collapsed.delete(n); else DR.collapsed.add(n);
      store.set('drCollapsed', JSON.stringify(Array.from(DR.collapsed))); renderTab(); break;
    }
    case 'dr-new-series': drNewSeries(); break;
    case 'dr-add-sub': drAddSub(el.dataset.series); break;
    case 'dr-rename-series': drRenameSeries(el.dataset.series); break;
    case 'dr-del-series': drDeleteSeries(el.dataset.series); break;
    case 'dr-rename-sub': drRenameSub(el.dataset.series, el.dataset.sub); break;
    case 'dr-del-sub': drDeleteSub(el.dataset.series, el.dataset.sub); break;
    case 'dr-rev': drCycleRev(el.dataset.key, Number(el.dataset.n)); break;
    case 'dr-up': drStep(-1); break;
    case 'dr-down': drStep(1); break;
    case 'dr-del': drDelete(); break;
    case 'cover-edit': openCoverEditor(); break;
    case 'cover-remove':
      if (confirm('Remove this project\'s cover photo? The file in Drive won\'t be deleted.')) { saveInfo({ 'Cover Photo': '', 'Cover Crop': '' }); render(true); }
      break;
    case 'cover-src': coverSrcTab(el.dataset.v); break;
    case 'cover-use-link': coverUseLink(); break;
    case 'pick-color': e.stopPropagation(); openColorPop(el); break;
    case 'edit-notes': e.stopPropagation(); openNotesPop(el); break;
    case 'save-notes': {
      e.stopPropagation();
      const pop = $('#notes-pop'); if (!pop) break;
      const pid = pop.dataset.id, v = pop.querySelector('textarea').value.replace(/\s+$/, '');
      closeNotesPop();
      if (v !== (projectById(pid).notes || '')) { saveInfo({ Notes: v }, pid); rerenderView(); }
      break;
    }
    case 'cancel-notes': e.stopPropagation(); closeNotesPop(); break;
    case 'set-color': {
      e.stopPropagation();
      const pid = el.dataset.id, c = el.dataset.c;
      closeColorPop();
      if (projColor(pid) !== c) { saveInfo({ Color: c }, pid); rerenderView(); }
      break;
    }
    case 'choose-buddy': chooseBuddy(Number(el.dataset.n)); break;
    case 'delete-row': deleteFromDrawer(); break;
    case 'toggle-done': {
      e.stopPropagation();
      const row = findRow('tasks', el.dataset.key);
      if (!row || row._pending && row._tmp) return;
      quickUpdate('tasks', el.dataset.key, { Status: isDone(row.Status) ? 'In Progress' : 'Done' });
      break;
    }
    case 'me-done': {
      const t = allOpenTasks().find(x => x._pid === el.dataset.pid && rowKey(x) === el.dataset.key);
      if (!t) return;
      el.classList.add('on');
      // ubah di ringkasan + cache project-nya, lalu simpan di belakang
      const ovp = S.overview.projects.find(p => p.id === t._pid);
      const item = ovp && ovp.tasks.items.find(x => x._row === t._row && x.Task === t.Task);
      if (item) { ovp.tasks.items.splice(ovp.tasks.items.indexOf(item), 1); ovp.tasks.open--; ovp.tasks.done++; }
      const d = S.cache[t._pid];
      let row = d && d.tasks.find(x => x._row === t._row && x.Task === t.Task);
      if (!row) { row = Object.assign({}, t); delete row._pid; delete row._pname; }
      localUpdate('tasks', row, { Status: 'Done' }, t._pid);
      toast('Done: ' + t.Task);
      setTimeout(() => { if (S.view === 'me') paintMe(); renderSidebar(); }, 180);
      break;
    }
    case 'set-stage': {
      const stage = el.dataset.stage;
      if (!S.project || (S.project.info || {}).Stage === stage) return;
      saveInfo({ Stage: stage });
      render(true);
      break;
    }
    case 'item-to-task': {
      localAdd('tasks', { Task: el.dataset.item, PIC: '', Status: list('Status')[0] || '', Start: todayStr() });
      toast('Task created. Set its PIC and deadline in the Tasks tab.');
      render(true);
      break;
    }
    case 'archive': {
      const v = el.dataset.v === 'true';
      if (v && !confirm('Archive this project? It disappears from the overview, but the sheet stays.')) return;
      try {
        await call('archiveProject', { id: S.projectId, archived: v });
        invalidateOverview(); await refreshBootstrap();
        S.project.project = Object.assign({}, S.project.project, { archived: v });
        toast(v ? 'Project archived.' : 'Project is active again.');
        renderProject();
      } catch (err) { handleError(err); }
      break;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (el.dataset.change === 'quick-field') {
    const rec = {}; rec[el.dataset.field] = el.value;
    el.className = 'pill-select ' + statusKey(el.value);
    quickUpdate(el.dataset.tab, el.dataset.key, rec);
  } else if (el.dataset.change === 'dr-pic') { S.ui.drPic = el.value; renderTab();
  } else if (el.dataset.change === 'dr-status') { S.ui.drStatus = el.value; renderTab();
  } else if (el.dataset.change === 'dr-bulk') { drBulkSet(el.dataset.f, el.value);
  } else if (el.dataset.change === 'dr-move') { if (el.value) { const t = el.value.split('\u0001'); drMove(drSelected(), t[0], t[1], null); }
  } else if (el.dataset.change === 'dr-dup') { drDuplicate(el.value);
  } else if (el.dataset.change === 'drive-mode') { driveModeUi();
  } else if (el.dataset.change === 'proj-meta') {
    const ch = {}; ch[el.dataset.field] = el.value;
    saveInfo(ch, el.dataset.id); rerenderView();
  } else if (el.dataset.change === 'proj-status-filter') { store.set('projStatus', el.value); renderSidebar();
  } else if (el.dataset.change === 'custom-color') {
    const pid = el.dataset.id, c = el.value.toUpperCase();
    closeColorPop();
    if (projColor(pid) !== c) { saveInfo({ Color: c }, pid); rerenderView(); }
  } else if (el.dataset.change === 'custom-color-field') {
    const radio = el.closest('.swatches').querySelector('.swatch.custom input[type=radio]');
    radio.value = el.value.toUpperCase(); radio.checked = true; radio.closest('.swatch').style.background = el.value;
  } else if (el.dataset.change === 'theme') {
    store.set('theme', el.value); applyTheme();
  } else if (el.dataset.change === 'task-pic') {
    S.ui.taskPic = el.value; renderTab();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#notes-pop')) closeNotesPop(); else if ($('#color-pop')) closeColorPop(); else if ($('#drawer-root')) closeDrawer(); else closeNav(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row.clickable')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('click', e => {
  const s = $('#shell');
  if (s && s.classList.contains('nav-open') && !e.target.closest('.sidebar, [data-action="toggle-nav"]')) closeNav();
}, true);
// Muat ulang ringkasan otomatis saat tab dibuka lagi
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.token) return;
  if ((S.view === 'home' || S.view === 'me') && Date.now() - S.overviewAt > 120000) repaintOverviewViews(true);
  if (S.view === 'project' && S.projectId && Date.now() - (S.cacheAt[S.projectId] || 0) > 60000) openProject(S.projectId, S.tab);
});

// Ambil data project duluan saat kursor mendekat, jadi pas diklik langsung kebuka
['mouseover', 'focusin', 'touchstart'].forEach(ev => document.addEventListener(ev, e => {
  const el = e.target.closest && e.target.closest('[data-action=open-project]');
  if (el && S.token) prefetch(el.dataset.id);
}, { passive: true }));

// Baris yang bisa diklik juga bisa dibuka pakai keyboard
new MutationObserver(() => {
  document.querySelectorAll('.row.clickable:not([tabindex])').forEach(r => r.setAttribute('tabindex', '0'));
}).observe(document.getElementById('app'), { childList: true, subtree: true });

// ---------- Versi baru (khusus versi GitHub) ----------
let updateToast = null;
function checkVersion() {
  if (!window.HUB_VERSION || updateToast) return;
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(v => {
    if (!v || !v.version || v.version === window.HUB_VERSION || updateToast) return;
    updateToast = toast('A new version of the app is available.', { sticky: true, action: 'Reload', onAction: () => {
      if (Q.jobs.length) { toast('Hold on, still saving to Google Sheets.'); updateToast = null; return; }
      location.reload();
    } });
  }).catch(() => {});
}
if (window.HUB_VERSION) {
  setInterval(checkVersion, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
}

// ---------- Start ----------
S.token = store.get('token');
if (S.token) boot(); else renderLogin('');
})();
</script>
